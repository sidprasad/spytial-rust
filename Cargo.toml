# Declaring a workspace at all is what pulls `macros` in: with no `[workspace]`
# section the root package is a workspace of one, `cargo metadata` lists only
# `spytial`, and `cargo test --workspace` silently skips the derive macro's own
# tests. That is how a doc example which could never compile sat green in CI.
#
# Once the section exists, path dependencies under the workspace root are
# members whether or not they are listed; `macros` is named anyway so the
# intent survives a reader who does not know that rule. tests/workspace.rs
# asserts the resolved membership, since deleting the section is the mistake
# that costs coverage.
#
# `eval-corpus` and `spec-codegen` stay out on purpose — each declares its own
# workspace, so they never enter this crate's build graph.
#
# `.claude/worktrees` holds Claude Code's git worktrees, physically nested
# inside this checkout. A worktree on a branch that predates this section has
# no `[workspace]` of its own, so cargo walks up, lands on this file, and —
# unless the path is excluded — refuses to build the worktree at all ("current
# package believes it's in a workspace when it's not"). tests/workspace.rs
# asserts the exclusion holds, the same way it guards the membership.
#
# `.` must not appear in `members` for that exclusion to work: cargo decides
# exclusion as "under an excluded path and not under a member path", and both
# are prefix checks, so a literal `.` makes every path in the checkout count
# as a member prefix and silently defeats `exclude`. The root package is a
# member regardless — it hosts this `[workspace]` section.
[workspace]
members = ["macros"]
exclude = [".claude/worktrees"]

[package]
name = "spytial"
version = "0.4.0"
edition = "2021"
authors = ["Siddhartha Prasad <siddhartha.a.prasad@gmail.com>"]
rust-version = "1.80"
description = "Drop-in replacement for std::dbg! that opens an interactive diagram of Rust values (Spytial for Rust)."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sidprasad/spytial-rust"
documentation = "https://docs.rs/spytial"
homepage = "https://github.com/sidprasad/spytial-rust"
keywords = ["spytial", "visualization", "diagram", "debugging", "graph"]
categories = ["visualization", "development-tools"]
exclude = [
    "target/",
    "Dockerfile",
    "docker-entrypoint.sh",
    ".github/",
    "docs/",
    "eval-corpus/",
    "spec-codegen/",
    "scripts/",
    # The conformance harness is test-only: tests/conformance.rs shells out to
    # it, nothing in `src/` reads it. The rest of templates/vendor is bundled
    # into the rendered page by `include_str!` and has to ship; this one file is
    # ~0.9 MB (3.2 MB before spytial-core 5.2) that would otherwise grow the
    # published crate by a quarter for code no consumer runs.
    # tests/conformance.rs skips when it is absent, which is
    # exactly what a consumer building from the published crate sees.
    "templates/vendor/spytial-check.js",
]

[dependencies]
inventory = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
serde-value = "0.7"
# The runtime consumes link-time registrations emitted by this exact derive
# version. Do not let a downstream lockfile pair a newer runtime with an older
# compatible macro that predates that output.
spytial_export_macros = { version = "=0.4.0", path = "./macros" }

[dev-dependencies]
# tests/schema.rs validates emitted specs against spytial-core's JSON Schema
# (draft 2020-12). The schema's references are all local `$defs`, so the
# resolver features are left off — and with them reqwest, and `idna`, whose
# ICU tables want a newer rustc than anything else here. This is a
# dev-dependency: consumers keep the crate's 1.80 floor, but running the test
# suite needs rustc 1.85, the validator's own floor.
jsonschema = { version = "0.55", default-features = false }
